# ============================================================================
# 有废宝 · 司机端
#   yfbwuliu.baibaitan.com  ->  /opt/youfeibao/dist/driver  (静态 dist)
#                    /admin-api,/app-api -> 127.0.0.1:18080 (yfb-backend 容器)
#
# 由部署脚本生成，改动请同步 /opt/youfeibao/deploy/nginx/ 下的副本。
# SSL 由宝塔面板申请后自动写入，勿手工改本文件的 443 段。
# ============================================================================
server {
    listen 80;
    server_name yfbwuliu.baibaitan.com;

    root /opt/youfeibao/dist/driver;
    index index.html;

    access_log /www/wwwlogs/yfbwuliu.baibaitan.com.log;
    error_log  /www/wwwlogs/yfbwuliu.baibaitan.com.error.log;

    client_max_body_size 100M;

    # ---- 后端接口 ----
    location /admin-api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }

    location /app-api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }

    # ---- WebSocket（yudao.websocket.path = /infra/ws）----
    location /infra/ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ---- 屏蔽常见扫描面 ----
    location ~* ^/(\.git|\.env|\.svn|\.DS_Store|WEB-INF|META-INF) { return 404; }
    location ~* ^/(actuator|druid|h2-console|nacos|consul) { return 404; }

    # ---- 静态资源缓存 ----
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA：history 路由回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
