<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="有废宝 基于 vue3 + CompositionAPI + typescript + vite3 + element plus 的后台管理系统！"
    />
    <meta
      name="description"
      content="有废宝 基于 vue3 + CompositionAPI + typescript + vite3 + element plus 的后台管理系统！"
    />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          display: flex;
          width: 100%;
          height: 100%;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          background: #f0f2f5;
        }

        .app-loading .app-loading-wrap {
          position: absolute;
          top: 50%;
          left: 50%;
          display: flex;
          -webkit-transform: translate3d(-50%, -50%, 0);
          transform: translate3d(-50%, -50%, 0);
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }

        .app-loading .app-loading-title {
          margin-bottom: 0;
          font-size: 20px;
          font-weight: bold;
          text-align: center;
        }

        .app-loading .app-loading-icon {
          width: 48px;
          height: 48px;
          margin: 0 auto 20px auto;
          -webkit-animation: loader-rotate 1s linear infinite;
          animation: loader-rotate 1s linear infinite;
        }

        .app-loading .app-loading-icon .app-loading-icon-track {
          stroke: #cfe3fb;
        }

        .app-loading .app-loading-icon .app-loading-icon-head {
          stroke: #2d8cf0;
        }

        @-webkit-keyframes loader-rotate {
          from {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
          }

          to {
            -webkit-transform: rotate(360deg);
            transform: rotate(360deg);
          }
        }

        @keyframes loader-rotate {
          from {
            -webkit-transform: rotate(0deg);
            transform: rotate(0deg);
          }

          to {
            -webkit-transform: rotate(360deg);
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <svg class="app-loading-icon" viewBox="0 0 50 50" aria-hidden="true">
            <circle
              class="app-loading-icon-track"
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke-width="5"
            />
            <circle
              class="app-loading-icon-head"
              cx="25"
              cy="25"
              r="20"
              fill="none"
              stroke-width="5"
              stroke-linecap="round"
              stroke-dasharray="80 200"
            />
          </svg>
          <div class="app-loading-title">有废宝</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
