pf4j:
#  pluginsDir: /tmp/
  pluginsDir: ../plugins

--- #################### 工商银行接口测试配置 ####################

# 工商银行接口测试配置
#
# 敏感信息不写入代码库，通过环境变量注入（ICBC_APP_ID、ICBC_OUT_VENDOR_ID、
# ICBC_PRIVATE_KEY、ICBC_APIGW_PUBLIC_KEY、ICBC_AES_KEY、ICBC_SM2_PRIVATE_KEY、
# ICBC_SM2_APIGW_PUBLIC_KEY）。
icbc:
  # 适配层运行模式：sdk（默认，经工行 SDK 出站）/ fake（假适配层，不触网）
  # 本地默认 fake，没配工行密钥时也能启动、能跑业务链路。
  gateway:
    mode: ${ICBC_GATEWAY_MODE:fake}

  # 公开令牌（自然人免登录端点）签名密钥。生产必须注入，长度建议 >= 32。
  public-token:
    secret: ${ICBC_PUBLIC_TOKEN_SECRET:}

  # 自然人登录凭证（会员用户）所属的平台租户。
  # 0 = 平台级，与 icbc_natural_person 这些全局表同一口径：一个手机号只对应一个登录凭证，
  # 不会跟着他扫码的那家回收企业的租户走（ADR 0017）。
  seller:
    platform-tenant-id: ${ICBC_SELLER_PLATFORM_TENANT_ID:0}

  # 场站与场站二维码（#34）：一码一场站，码内不带任何令牌，只编码场站码。
  # entry-url 是自然人端入口地址（二维码指向它）；未配置时只返回 `?station=<code>` 相对链接。
  station:
    entry-url: ${ICBC_STATION_ENTRY_URL:}
    # 免登录场站公开信息读取限流：每 IP 每分钟允许的次数
    resolve-per-minute: ${ICBC_STATION_RESOLVE_PER_MINUTE:60}

  # 出售者触达（#36，ADR 0023）：短信三条 + 收货员一键转达。
  # sms-enabled 是**平台级**开关，默认关闭（费用与到达率是运营成本）；租户可在
  # 「触达记录」页单独开启，两者取或。seller-app-url 是拼一次性令牌链接的自然人端入口，
  # 未配置时退化用下面的 station.entry-url；两条都为空就只能复制令牌，拼不出可点链接。
  notify:
    sms-enabled: ${ICBC_NOTIFY_SMS_ENABLED:false}
    seller-app-url: ${ICBC_SELLER_APP_URL:}

  # 结算单与确认门禁（#33）：一次到场批次一次确认，确认是开票硬前置。
  # 三个超时都可配；到期**不自动确认**，而是升级为线下签字 / 提醒。
  settlement:
    # 生成后待确认时限（天）：超期升级为「需线下签字确认」
    confirm-timeout-days: ${ICBC_SETTLEMENT_CONFIRM_TIMEOUT_DAYS:7}
    # 异议后企业处理时限（天）：超期自然人侧显示「企业尚未回复」并给留联系方式的口子
    reply-timeout-days: ${ICBC_SETTLEMENT_REPLY_TIMEOUT_DAYS:3}
    # 已确认但长期未开票时限（天）：只提醒企业尽快开票付款，不自动作废
    uninvoiced-timeout-days: ${ICBC_SETTLEMENT_UNINVOICED_TIMEOUT_DAYS:30}

  # 出售者建档：工行 UI 页面接口的回调 / 跳转地址，须为外网可达地址（不是工行地址）。
  # 工行不支持 scheme，jump / fail-jump 只能用 https 页面；自然人在小程序 web-view 里打开后
  # 再由前端路由回具体页面。本地 fake 模式留空即可；联调时用 ngrok 等暴露出去。
  seller-onboarding:
    callback-url: ${ICBC_ONBOARDING_CALLBACK_URL:}
    jump-url: ${ICBC_ONBOARDING_JUMP_URL:}
    fail-jump-url: ${ICBC_ONBOARDING_FAIL_JUMP_URL:}
    face-callback-url: ${ICBC_FACE_CALLBACK_URL:}

  api:
    # 应用ID（合作方编号）
    app-id: ${ICBC_APP_ID:}

    # 付方平台外部编号（子商户标识）
    out-vendor-id: ${ICBC_OUT_VENDOR_ID:}

    # RSA私钥
    private-key: ${ICBC_PRIVATE_KEY:}

    # 工行API网关RSA公钥
    apigw-public-key: ${ICBC_APIGW_PUBLIC_KEY:}

    # AES加密密钥（Base64，16字节）
    aes-key: ${ICBC_AES_KEY:}

    # SM2私钥
    sm2-private-key: ${ICBC_SM2_PRIVATE_KEY:}

    # SM2公钥
    sm2-apigw-public-key: ${ICBC_SM2_APIGW_PUBLIC_KEY:}

    # 签名算法类型
    sign-type: RSA2

    # 字符集
    charset: UTF-8

    # 数据格式
    format: json

    # 加密类型
    encrypt-type: AES

    # 接口超时时间（毫秒）
    timeout: 30000

    # 工行网关基础URL
    base-url: https://gw.open.icbc.com.cn

    # 支付页面URL
    payment-url: https://gw.open.icbc.com.cn/ui/jft/ui/invoice/pay/V1

    # 发票查询URL
    invoice-query-url: https://gw.open.icbc.com.cn/api/jft/api/invoice/queryInvoiceInfo/V1

    # 聚富通智慧清分收方查询URL
    user-query-url: https://gw.open.icbc.com.cn/api/jft/api/user/edpreceive/query/V1
